include:
  - project: ulysse_durand/str2str-api
    file: templates/str2str-api.yml
  - project: ulysse_durand/code-runner
    file: deploy-code-runner.yml

stages:
  - build
  - deploy

build-api:
  stage: build
  extends: .str2str-api-build
  variables:
    STR2STR_DIR: .
    STR2STR_IMAGENAME: str2str
    API_IMAGENAME: api

deploy-coderunner:
  stage: deploy
  extends: .deploy-coderunner
  variables:
    TITLE: "Calcul formel"
    HEADLINE: "Try it out ! Calcul formel"
    LANG: ocaml
    API_URL: https://api-calcul-formel.uldr.fr
    DESC: "New functions can be used: latex_en_expression, derive, simplifiebis and affiche."

pages:
  stage: deploy
  needs:
    - job: deploy-coderunner
  script:
    - echo "Deploying page"
  artifacts:
    paths:
      - public
